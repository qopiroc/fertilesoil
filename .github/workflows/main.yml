name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          for f in *.zip; do unzip -o "$f"; done
          ls -R fertilesoil | head -50

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
          build-root-directory: fertilesoil

      - name: Build
        working-directory: fertilesoil
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: fertilesoil-jar
          path: fertilesoil/build/libs/*.jar
